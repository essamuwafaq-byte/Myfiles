name: Build Headswap (Essa)
on:
  push:
    branches: [ essa/wireless-retry ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Accept SDK licenses
        run: |
          SDKM="$(ls -1d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
      - name: Unit tests
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest --tests '*BlackScreenWatchdogTest*' --tests '*AaBridgeGraceTest*'
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: headswap-essa
          path: android/app/build/outputs/apk/debug/*.apk
